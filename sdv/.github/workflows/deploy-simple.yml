name: Deploy (simple rsync)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "rsync --dry-run first?"
        required: true
        type: choice
        default: "true"
        options: [ "true", "false" ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Start ssh-agent and add key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Rsync to server (simple)
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -e
          RSYNC_DRY=""
          if [ "$DRY" = "true" ]; then RSYNC_DRY="--dry-run"; fi
          rsync -az $RSYNC_DRY --delete \
            --exclude-from=deploy-exclude.txt \
            -e "ssh -p ${DEPLOY_SSH_PORT:-22} -o StrictHostKeyChecking=yes" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
