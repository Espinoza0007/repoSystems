services:
  api:
    build:
      context: ..
      dockerfile: src/SDV.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      Jwt__Key: ${SDV_JWT_KEY}
      Jwt__Issuer: sdv-api
      Jwt__Audience: sdv-clients
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ..
      dockerfile: src/SDV.Web/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports: ["8081:8080"]
    depends_on: [api]
